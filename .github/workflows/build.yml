name: Build x360ce Windows x64

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-native:
    name: Build Native DLL (x64)
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build x360ce DLL solution (Release|x64)
        run: |
          msbuild x360ce_dll.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v142 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /m `
            /v:minimal

      - name: Upload native DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x360ce-native-x64
          path: |
            x360ce/x360ce/bin64/Release/
            x360ce/dinput8/bin64/Release/
          if-no-files-found: warn

  build-dotnet:
    name: Build .NET Application
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore x360ce.sln

      - name: Build .NET solution (Release|Any CPU)
        run: |
          msbuild x360ce.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /m `
            /v:minimal

      - name: Upload .NET application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x360ce-app
          path: |
            x360ce.App.Beta/bin/Release/
          if-no-files-found: warn
